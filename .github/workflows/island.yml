name: Island banner

# Once a day: redraw the banner, whose island is the contribution garden (light + dark versions).
on:
  schedule:
    - cron: "0 17 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  garden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Redraw the island
        run: python3 tools/make_profile.py
        env:
          GH_USER: ${{ github.repository_owner }}

      - name: Commit & push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add assets/island-light.svg assets/island-dark.svg README.md
          if git commit -m "Island: replant the garden"; then
            git push
          fi
