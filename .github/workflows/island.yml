name: Contribution garden

# Once a day: replant the garden with the latest contributions (light + dark versions).
on:
  schedule:
    - cron: "0 17 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  garden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Replant the garden
        run: python3 tools/make_garden.py
        env:
          GH_USER: ${{ github.repository_owner }}

      - name: Commit & push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add assets/garden-light.svg assets/garden-dark.svg
          if git commit -m "Replant the garden"; then
            git push
          fi
